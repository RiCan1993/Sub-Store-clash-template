dns:
  enable: true
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  nameserver:
    - https://dns.google/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://dns.google/dns-query
  nameserver-policy:
    "rule-set:GeoSite-CN":
      - https://dns.alidns.com/dns-query
    "rule-set:GeoSite-Geolocation-CN":
      - https://dns.alidns.com/dns-query
    "rule-set:GFW":
      - https://dns.google/dns-query
    "rule-set:GeoSite-Geolocation-Non-CN":
      - https://dns.google/dns-query
  respect-rules: true

proxy-groups:
  - name: 🚀 节点选择
    type: select
    interval: 300
    timeout: 5000
    max-failed-times: 5
    lazy: true
    include-all-proxies: true
    proxies:
      - 🎈 自动选择
  - name: 🎈 自动选择
    type: url-test
    interval: 300
    timeout: 5000
    max-failed-times: 5
    lazy: true
    url: http://www.gstatic.com/generate_204
    include-all-proxies: true
    proxies: []
  - name: 🎯 全球直连
    type: select
    interval: 300
    timeout: 5000
    max-failed-times: 5
    lazy: true
    include-all-proxies: false
    proxies:
      - DIRECT
  - name: 🛑 全球拦截
    type: select
    interval: 300
    timeout: 5000
    max-failed-times: 5
    lazy: true
    include-all-proxies: false
    proxies:
      - REJECT

rule-providers:
  GeoIP-Private:
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs
    path: ./ruleset/private.mrs
    behavior: ipcidr
    interval: 86400
    format: mrs
    type: http
    proxy: 🚀 节点选择
  GeoSite-Category-Ads-All:
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs
    path: ./ruleset/category-ads-all.mrs
    behavior: domain
    interval: 86400
    format: mrs
    type: http
    proxy: 🚀 节点选择
  GFW:
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/gfw.mrs
    path: ./ruleset/gfw.mrs
    behavior: domain
    interval: 86400
    format: mrs
    type: http
    proxy: 🚀 节点选择
  GeoSite-CN:
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
    path: ./ruleset/cn.mrs
    behavior: domain
    interval: 86400
    format: mrs
    type: http
    proxy: 🚀 节点选择
  GeoSite-Geolocation-CN:
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-cn.mrs
    path: ./ruleset/geolocation-cn.mrs
    behavior: domain
    interval: 86400
    format: mrs
    type: http
    proxy: 🚀 节点选择
  GeoSite-Geolocation-Non-CN:
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs
    path: ./ruleset/geolocation-non-cn.mrs
    behavior: domain
    interval: 86400
    format: mrs
    type: http
    proxy: 🚀 节点选择
  GeoIP-CN:
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs
    path: ./ruleset/cn-ip.mrs
    behavior: ipcidr
    interval: 86400
    format: mrs
    type: http
    proxy: 🚀 节点选择

rules:
  - "RULE-SET,GeoIP-Private,🎯 全球直连"
  - "RULE-SET,GeoSite-Category-Ads-All,🛑 全球拦截"
  - "RULE-SET,GeoSite-CN,🎯 全球直连"
  - "RULE-SET,GeoSite-Geolocation-CN,🎯 全球直连"
  - "RULE-SET,GeoIP-CN,🎯 全球直连"
  - "RULE-SET,GFW,🚀 节点选择"
  - "RULE-SET,GeoSite-Geolocation-Non-CN,🚀 节点选择"
  - "MATCH,🚀 节点选择"
proxy-groups:
  - name: 🚀 节点选择
    type: select
    interval: 300
    timeout: 5000
    max-failed-times: 5
    lazy: true
    include-all-proxies: true
    proxies:
      - 🎈 自动选择
  - name: 🎈 自动选择
    type: url-test
    interval: 300
    timeout: 5000
    max-failed-times: 5
    lazy: true
    url: http://www.gstatic.com/generate_204
    include-all-proxies: true
    proxies: []
  - name: 🎯 全球直连
    type: select
    interval: 300
    timeout: 5000
    max-failed-times: 5
    lazy: true
    include-all-proxies: false
    proxies:
      - DIRECT
  - name: 🛑 全球拦截
    type: select
    interval: 300
    timeout: 5000
    max-failed-times: 5
    lazy: true
    include-all-proxies: false
    proxies:
      - REJECT

rule-providers:
  GeoIP-Private:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs
    path: ./ruleset/private.mrs
    behavior: ipcidr
    interval: 86400
    format: text
    type: http
  GeoSite-Category-Ads-All:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.mrs
    path: ./ruleset/category-ads-all.mrs
    behavior: domain
    interval: 86400
    format: text
    type: http
  GFW:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/gfw.mrs
    path: ./ruleset/gfw.mrs
    behavior: domain
    interval: 86400
    format: text
    type: http
  GeoSite-CN:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs
    path: ./ruleset/cn.mrs
    behavior: domain
    interval: 86400
    format: text
    type: http
  GeoIP-CN:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs
    path: ./ruleset/cn-ip.mrs
    behavior: ipcidr
    interval: 86400
    format: text
    type: http

rules:
  - "DOMAIN-SUFFIX,superfj.com,🎯 全球直连"
  - "IP-CIDR,207.57.123.187/32,🎯 全球直连,no-resolve"
  - "IP-CIDR,2001:df1:7880:6::c4/128,🎯 全球直连,no-resolve"
  - "RULE-SET,GeoIP-Private,🎯 全球直连"
  - "RULE-SET,GeoSite-Category-Ads-All,🛑 全球拦截"
  - "RULE-SET,GeoSite-CN,🎯 全球直连"
  - "RULE-SET,GeoIP-CN,🎯 全球直连"
  - "RULE-SET,GFW,🚀 节点选择"
  - "MATCH,🚀 节点选择"
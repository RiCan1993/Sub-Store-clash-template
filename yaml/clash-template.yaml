proxy-groups:
  - name: 🚀 节点选择
    type: select
    interval: 300
    timeout: 5000
    max-failed-times: 5
    lazy: true
    include-all-proxies: true
    proxies:
      - 🎈 自动选择
  - name: 🎈 自动选择
    type: url-test
    interval: 300
    timeout: 5000
    max-failed-times: 5
    lazy: true
    url: http://www.gstatic.com/generate_204
    include-all-proxies: true
    proxies: []
  - name: 🎯 全球直连
    type: select
    interval: 300
    timeout: 5000
    max-failed-times: 5
    lazy: true
    include-all-proxies: false
    proxies:
      - DIRECT
  - name: 🛑 全球拦截
    type: select
    interval: 300
    timeout: 5000
    max-failed-times: 5
    lazy: true
    include-all-proxies: false
    proxies:
      - REJECT

rule-providers:
  private:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.list
    path: ./ruleset/private.list
    behavior: ipcidr
    interval: 86400
    format: text
    type: http
  category-ads-all:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.list
    path: ./ruleset/category-ads-all.list
    behavior: domain
    interval: 86400
    format: text
    type: http
  ProxyGFWlist:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/gfw.list
    path: ./ruleset/gfw.list
    behavior: domain
    interval: 86400
    format: text
    type: http
  ChinaDomain:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.list
    path: ./ruleset/cn.list
    behavior: domain
    interval: 86400
    format: text
    type: http
  ChinaCompanyIp:
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.list
    path: ./ruleset/cn-ip.list
    behavior: ipcidr
    interval: 86400
    format: text
    type: http

rules:
  - "DOMAIN-SUFFIX,superfj.com,🎯 全球直连"
  - "IP-CIDR,207.57.123.187/32,🎯 全球直连,no-resolve"
  - "IP-CIDR,2001:df1:7880:6::c4/128,🎯 全球直连,no-resolve"
  - "RULE-SET,private,🎯 全球直连"
  - "RULE-SET,category-ads-all,🛑 全球拦截"
  - "RULE-SET,ProxyGFWlist,🚀 节点选择"
  - "RULE-SET,ChinaDomain,🎯 全球直连"
  - "RULE-SET,ChinaCompanyIp,🎯 全球直连"
  - "GEOIP,CN,🎯 全球直连"
  - "MATCH,🚀 节点选择"
